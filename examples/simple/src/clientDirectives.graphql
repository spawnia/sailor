query ClientDirectiveQuery($value: Boolean!) {
    scalarWithArg @skip(if: true)
    twoArgs @include(if: $value)
}

query SkipNonNullable($skip: Boolean!) {
    nonNullable @skip(if: $skip)
}

query IncludeObject($include: Boolean!) {
    singleObject @include(if: $include) {
        value
    }
}

query SkipAliasedNonNullable($skip: Boolean!) {
    skipped: nonNullable @skip(if: $skip)
    nonNullable
}
